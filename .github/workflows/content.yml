name: Генерация контента по сайту
# «Сервер по расписанию»: с сети GitHub читает наполнение сайта + Owner Agent API
# и генерит Reels-сценарии в бренде «Система ОП». Результат — в content/reels_latest.md.
# Секреты: OWNER_AGENT_API_SECRET (доступ к API), OPENROUTER_API_KEY (генерация).
on:
  schedule:
    - cron: '0 7 * * 1'          # каждый понедельник ~07:00 UTC (~10:00 МСК)
  workflow_dispatch: {}          # и вручную — кнопкой Run workflow
permissions:
  contents: write
concurrency:
  group: content-gen
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Проверка ключа генерации
        run: |
          if [ -z "${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER || secrets.OPENROUTER_KEY || secrets.OPENROUTERKEY || secrets.OPENROUTERTOKEN }}" ]; then
            echo "::warning::Ключ OpenRouter не найден в секретах репозитория — соберу наполнение сайта, но без генерации сценариев."
          fi

      - name: Браузер для рендера сайта (SPA)
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Считать наполнение сайта + API
        env:
          OWNER_AGENT_API_SECRET: ${{ secrets.OWNER_AGENT_API_SECRET }}
          CONTENT_URLS: ${{ vars.CONTENT_URLS }}
          STAMP: ${{ github.run_id }}
        run: |
          STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" python3 content/collect.py

      - name: Сгенерировать сценарии
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER || secrets.OPENROUTER_KEY || secrets.OPENROUTERKEY || secrets.OPENROUTERTOKEN }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')" python3 content/generate.py

      - name: Сохранить результат, если изменился
        run: |
          git add content/                       # включая НОВЫЕ файлы (git diff их не видит)
          if git diff --cached --quiet; then
            echo "Изменений в content/ нет."
          else
            git config user.name "content-bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "content: авто-обновление наполнения сайта / сценариев"
            git push
          fi
