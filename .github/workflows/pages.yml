name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Деплой с 4 попытками и нарастающими паузами — от разовых сбоев GitHub Pages
      - id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.d1.outcome == 'failure'
        run: sleep 30
      - id: d2
        continue-on-error: true
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 60
      - id: d3
        continue-on-error: true
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure' && steps.d3.outcome == 'failure'
        run: sleep 90
      - id: d4
        continue-on-error: true
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure' && steps.d3.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # Итог: если хоть одна попытка удалась — успех. Если все 4 не удались (крайне
      # редкий сбой на стороне GitHub) — НЕ помечаем job ошибкой, чтобы не было ложного
      # сигнала: следующая волна через 3 часа всё равно обновит платформу.
      - name: Result
        run: |
          if [ "${{ steps.d1.outcome }}" = "success" ] || [ "${{ steps.d2.outcome }}" = "success" ] || [ "${{ steps.d3.outcome }}" = "success" ] || [ "${{ steps.d4.outcome }}" = "success" ]; then
            echo "✅ Деплой платформы успешен."
          else
            echo "⚠️ Все 4 попытки деплоя не удались (сбой GitHub Pages). Платформа осталась на прошлой версии; следующая волна через 3 часа обновит её. Job намеренно завершён без ошибки."
          fi
