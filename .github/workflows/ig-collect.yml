name: Сбор статистики Instagram
# «Сервер по расписанию»: тянет статистику Reels из Instagram по токену,
# обновляет reels.json и передеплоивает панель. Токен — в секрете IG_ACCESS_TOKEN.
on:
  schedule:
    - cron: '17 6 * * *'        # каждый день ~06:17 UTC (~09:17 МСК)
  workflow_dispatch: {}          # и вручную — кнопкой Run workflow
permissions:
  contents: write
  actions: write
concurrency:
  group: ig-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Проверка секрета
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IGTOKEN || secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "::error::Секрет IGTOKEN не задан. Добавь его: Settings → Secrets and variables → Actions → New repository secret (имя IGTOKEN)."
            exit 1
          fi

      - name: Сбор статистики
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IGTOKEN || secrets.IG_ACCESS_TOKEN }}
        run: |
          python3 montage/ig_stats.py --whoami
          python3 montage/ig_stats.py --limit 25 --write --stamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Отправить обновление, если статистика изменилась
        id: commit
        run: |
          if git diff --quiet -- reels.json; then
            echo "Изменений в reels.json нет."
          else
            git config user.name "reels-bot"
            git config user.email "actions@users.noreply.github.com"
            git add reels.json
            git commit -m "reels: авто-обновление статистики из Instagram"
            git push
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Передеплой панели
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml || echo "деплой не запустился — обновится при следующей волне"
