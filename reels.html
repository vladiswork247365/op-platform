<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reels · Аналитика удержания — Система ОП</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090B;--bg2:#111116;--bg3:#18181F;--bg4:#1E1E28;
  --bdr:rgba(255,255,255,0.07);--bdr2:rgba(255,255,255,0.13);
  --red:#E8000A;--red2:#FF1F3D;--rdim:rgba(232,0,10,0.14);
  --text:#F0F0F5;--t2:#A0A0B0;--t3:#555565;
  --gold:#F5A623;--gld2:#FFD700;--grn:#00C851;--blu:#4A9EFF;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
header{position:sticky;top:0;z-index:50;height:56px;background:rgba(9,9,11,.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 18px;gap:14px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--red),#7a0006);
  display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:16px;color:#fff;box-shadow:0 0 16px rgba(232,0,10,.4)}
.logo-main{font-family:'Bebas Neue';font-size:16px;letter-spacing:1.4px}
.logo-main em{color:var(--red);font-style:normal}
.hspace{flex:1}
.back{font-size:11px;font-weight:600;color:var(--t2);border:1px solid var(--bdr);border-radius:7px;padding:6px 12px}
.back:hover{border-color:var(--red);color:var(--red)}
.upd{font-family:'JetBrains Mono';font-size:10px;color:var(--t3)}
.wrap{max-width:1200px;margin:0 auto;padding:18px}
h1{font-family:'Bebas Neue';font-size:34px;letter-spacing:1.4px;line-height:.95;margin-bottom:3px}
h1 em{color:var(--red);font-style:normal}
.sub{font-size:12px;color:var(--t2);margin-bottom:16px}
.section-t{font-family:'Bebas Neue';font-size:15px;letter-spacing:1.1px;color:var(--t2);margin:22px 0 10px;display:flex;align-items:center;gap:9px}
.section-t::before{content:"";width:4px;height:14px;background:var(--red);border-radius:2px}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--bg3);border:1px solid var(--bdr);border-radius:11px;padding:12px 13px}
.kpi .v{font-family:'Bebas Neue';font-size:27px;line-height:.9}
.kpi .v.r{color:var(--red)}.kpi .v.g{color:var(--gold)}.kpi .v.gr{color:var(--grn)}.kpi .v.b{color:var(--blu)}
.kpi .l{font-size:8.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-top:5px}

.panel{background:var(--bg2);border:1px solid var(--bdr);border-radius:14px;padding:16px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:10px;color:var(--t2)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:13px;height:3px;border-radius:2px;display:inline-block}

.insight{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bdr);font-size:12px;line-height:1.45}
.insight:last-child{border:none}
.insight .ic{font-size:15px;flex-shrink:0}
.insight b{color:var(--text)}
.insight .up{color:var(--grn);font-weight:700}.insight .dn{color:var(--red2);font-weight:700}

table.reels{width:100%;border-collapse:collapse;font-size:11.5px}
table.reels th{text-align:left;font-size:8.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);padding:8px 8px;border-bottom:1px solid var(--bdr);font-weight:700}
table.reels td{padding:9px 8px;border-bottom:1px solid var(--bdr);vertical-align:middle}
table.reels tr{cursor:pointer;transition:.12s}
table.reels tbody tr:hover{background:var(--bg3)}
.rt-title{font-weight:600;color:var(--text)}
.plat{font-family:'JetBrains Mono';font-size:9px;color:var(--t3)}
.num{font-family:'JetBrains Mono';font-size:11px}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--bg4);width:52px;position:relative;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.g{font-family:'Bebas Neue';font-size:14px;width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.g-S{background:linear-gradient(135deg,#FFD700,#F5A623);color:#111}.g-A{background:linear-gradient(135deg,#00C851,#00963d)}
.g-B{background:linear-gradient(135deg,#4A9EFF,#2b6fd1)}.g-C{background:linear-gradient(135deg,#F5A623,#c47f10)}.g-D{background:linear-gradient(135deg,#E8000A,#7a0006)}
.chips{display:flex;gap:3px;flex-wrap:wrap}
.chip{font-size:8px;font-weight:700;padding:2px 5px;border-radius:4px;background:var(--bg4);color:var(--t2);white-space:nowrap}
.flag{font-size:8.5px;font-weight:700;color:var(--red2);white-space:nowrap}

/* detail */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.overlay.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bdr2);border-radius:16px;max-width:760px;width:100%;padding:20px;margin:auto}
.modal h2{font-family:'Bebas Neue';font-size:24px;letter-spacing:.6px}
.mclose{float:right;cursor:pointer;color:var(--t3);font-size:20px;line-height:1}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
@media(max-width:600px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.cell{background:var(--bg);border:1px solid var(--bdr);border-radius:9px;padding:9px 11px}
.cell .cv{font-family:'Bebas Neue';font-size:20px}.cell .cl{font-size:8px;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-top:3px}
.dropbox{background:rgba(232,0,10,.06);border:1px solid rgba(232,0,10,.22);border-radius:10px;padding:11px 13px;margin-top:12px;font-size:11.5px;color:var(--t2);line-height:1.5}
.dropbox b{color:var(--red2)}
.tl{margin-top:12px;overflow-x:auto}
table.timeline{width:100%;border-collapse:collapse;font-size:10.5px;min-width:520px}
table.timeline th{text-align:left;font-size:8px;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);padding:6px 8px;border-bottom:1px solid var(--bdr)}
table.timeline td{padding:7px 8px;border-bottom:1px solid var(--bdr);color:var(--t2);vertical-align:top;line-height:1.35}
.tl-t{font-family:'JetBrains Mono';font-size:9px;color:var(--red);white-space:nowrap}
.entry{background:var(--bg3);border:1px dashed var(--bdr2);border-radius:11px;padding:13px 15px;font-size:11.5px;color:var(--t2);line-height:1.55;margin-top:8px}
.entry b{color:var(--text)}.entry code{font-family:'JetBrains Mono';font-size:10.5px;background:var(--bg);padding:1px 5px;border-radius:4px}
.foot{text-align:center;color:var(--t3);font-size:10px;margin:26px 0 12px;line-height:1.6}
.err{background:var(--rdim);border:1px solid rgba(232,0,10,.3);border-radius:12px;padding:20px;font-size:12px;text-align:center;color:var(--t2)}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html"><div class="logo-icon">S</div><div class="logo-main">REELS <em>АНАЛИТИКА</em></div></a>
  <div class="hspace"></div>
  <div class="upd" id="upd"></div>
  <a class="back" href="index.html">← Платформа</a>
</header>
<div class="wrap">
  <h1>АНАЛИЗ <em>УДЕРЖАНИЯ</em></h1>
  <div class="sub">Как аудитория задерживается на каждом ролике — по статистике активности (Instagram / TikTok Insights). Прогноз ↔ факт, точки слива, что поднимает досмотр.</div>
  <div id="app"><div class="err">Загрузка…</div></div>
  <div class="foot">Система ОП · Панель удержания Reels · данные в <code style="font-family:'JetBrains Mono'">reels.json</code></div>
</div>
<div class="overlay" id="ov" onclick="if(event.target===this)closeM()"><div class="modal" id="modal"></div></div>

<script>
const EMBEDDED = window.__REELS__ || null;
let DATA=null;
function grade(t){return t>=85?'S':t>=70?'A':t>=55?'B':t>=40?'C':'D'}
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fmt(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':(''+n)}
function avg(a){return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0}
function toolLabel(k){return (DATA.tool_labels&&DATA.tool_labels[k])||k}

async function load(){
  try{
    if(EMBEDDED){DATA=EMBEDDED;}
    else{const r=await fetch('reels.json?v='+Date.now());DATA=await r.json();}
    document.getElementById('upd').textContent='обновлено: '+new Date(DATA.updatedAt).toLocaleDateString('ru-RU');
    render();
  }catch(e){document.getElementById('app').innerHTML='<div class="err">Не удалось загрузить данные ('+esc(e.message)+').</div>';}
}

function withActual(){return DATA.reels.filter(r=>r.actual);}
function curveArea(a){return a.reduce((s,v,i)=>s+v,0)/a.length;} // грубый показатель площади под кривой

// точка максимального слива по кривой факта (сегменты 0-25-50-75-100)
function dropoff(curve){
  let mi=1,md=0;
  for(let i=1;i<curve.length;i++){const d=curve[i-1]-curve[i];if(d>md){md=d;mi=i;}}
  const seg=['0–25%','25–50%','50–75%','75–100%'][mi-1]||'—';
  return {seg,drop:md};
}

function kpis(){
  const A=withActual();
  const views=A.reduce((s,r)=>s+(r.actual.views||0),0);
  const aw=avg(A.map(r=>r.actual.avg_watch_pct));
  const hk=avg(A.map(r=>r.actual.hook3s));
  const cmp=avg(A.map(r=>r.actual.completion));
  const best=A.reduce((b,r)=>r.actual.completion>(b?b.actual.completion:-1)?r:b,null);
  const eng=A.reduce((s,r)=>s+(r.actual.saves||0)+(r.actual.shares||0),0);
  return `<div class="kpis">
    <div class="kpi"><div class="v">${A.length}</div><div class="l">роликов</div></div>
    <div class="kpi"><div class="v g">${aw}%</div><div class="l">средний досмотр</div></div>
    <div class="kpi"><div class="v b">${hk}%</div><div class="l">hook 3с (удержал)</div></div>
    <div class="kpi"><div class="v gr">${cmp}%</div><div class="l">до конца</div></div>
    <div class="kpi"><div class="v r">${fmt(views)}</div><div class="l">просмотров</div></div>
    <div class="kpi"><div class="v">${fmt(eng)}</div><div class="l">сохр.+репостов</div></div>
  </div>`;
}

// оверлей всех кривых удержания
function overlayChart(){
  const A=withActual(); const W=100,H=52,pad=4;
  const xp=i=>pad+(W-2*pad)*(i/4), yp=v=>pad+(H-2*pad)*(1-v/100);
  const cols=['#E8000A','#4A9EFF','#00C851','#F5A623','#FF1F3D','#9b59ff','#00d0d0'];
  let grid='';[0,25,50,75,100].forEach(v=>{const y=yp(v);grid+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#18181F" stroke-width=".5"/>`;});
  let lines='';A.forEach((r,i)=>{const c=cols[i%cols.length];const p=r.actual.curve.map((v,j)=>`${j?'L':'M'}${xp(j).toFixed(1)},${yp(v).toFixed(1)}`).join(' ');
    lines+=`<path d="${p}" fill="none" stroke="${c}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`;});
  const labels=[0,25,50,75,100].map((x,i)=>`<text x="${xp(i)}" y="${H-.5}" fill="#555565" font-size="3.2" text-anchor="${i==0?'start':i==4?'end':'middle'}">${x}%</text>`).join('');
  const leg=A.map((r,i)=>`<span><i style="background:${cols[i%cols.length]}"></i>${esc(r.title.slice(0,22))}</span>`).join('');
  return `<div class="panel"><div class="section-t" style="margin-top:0">Кривые удержания — все ролики</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="height:200px">${grid}${lines}${labels}</svg>
    <div style="font-size:10px;color:var(--t3);margin-top:6px">Ось X — доля ролика, Y — % ещё смотрящих. Чем положе линия — тем лучше удержание.</div>
    <div class="legend">${leg}</div></div>`;
}

// авто-инсайты: корреляция инструментов и досмотра
function insights(){
  const A=withActual();
  const out=[];
  // 1. инструмент → средний досмотр до конца (с/без)
  const tools=['word_subs','sfx','kick','beat_sync','broll'];
  tools.forEach(t=>{
    const wi=A.filter(r=>(r.tools_used||[]).includes(t)), wo=A.filter(r=>!(r.tools_used||[]).includes(t));
    if(wi.length&&wo.length){
      const a=avg(wi.map(r=>r.actual.completion)), b=avg(wo.map(r=>r.actual.completion));
      if(Math.abs(a-b)>=4) out.push({d:a-b,txt:`<b>${toolLabel(t)}</b>: досмотр до конца <span class="${a>=b?'up':'dn'}">${a}%</span> с инструментом vs <b>${b}%</b> без — разница <span class="${a>=b?'up':'dn'}">${a-b>0?'+':''}${a-b} п.п.</span>`,ic:a>=b?'📈':'📉'});
    }
  });
  // 2. хук 3с → до конца (сильный старт держит до конца)
  const strong=A.filter(r=>r.actual.hook3s>=75), weak=A.filter(r=>r.actual.hook3s<70);
  if(strong.length&&weak.length){const a=avg(strong.map(r=>r.actual.completion)),b=avg(weak.map(r=>r.actual.completion));
    out.push({d:a-b,txt:`Сильный <b>хук (≥75% на 3с)</b> → досмотр <span class="up">${a}%</span> до конца vs <b>${b}%</b> при слабом старте`,ic:'🎣'});}
  // 3. длина → до конца
  const shortR=A.filter(r=>r.duration<=30), longR=A.filter(r=>r.duration>35);
  if(shortR.length&&longR.length){const a=avg(shortR.map(r=>r.actual.completion)),b=avg(longR.map(r=>r.actual.completion));
    out.push({d:a-b,txt:`Ролики <b>≤30с</b> досматривают на <span class="${a>=b?'up':'dn'}">${a}%</span> vs <b>${b}%</b> у длинных (>35с)`,ic:'⏱'});}
  out.sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));
  return `<div class="panel"><div class="section-t" style="margin-top:0">Что поднимает досмотр (авто-выводы)</div>
    ${out.slice(0,6).map(i=>`<div class="insight"><span class="ic">${i.ic}</span><span>${i.txt}</span></div>`).join('')||'<div style="color:var(--t3);font-size:12px">Мало данных для корреляций — добавь ещё роликов с фактом.</div>'}</div>`;
}

function reelsTable(){
  const A=withActual().slice().sort((a,b)=>b.actual.completion-a.actual.completion);
  const rows=A.map(r=>{
    const a=r.actual, g=r.variants?grade(r.variants.reduce((m,v)=>Math.max(m,v.score.total),0)):grade(a.completion);
    const spark=miniCurve(a.curve);
    const doff=dropoff(a.curve);
    const tools=(r.tools_used||[]).slice(0,5).map(t=>`<span class="chip">${esc(toolLabel(t))}</span>`).join('');
    return `<tr onclick="openM('${r.id}')">
      <td><div class="rt-title">${esc(r.title)}</div><div class="plat">${esc(a.platform||r.platform)} · ${r.duration}с · ${esc(a.published||'')}</div></td>
      <td class="num">${fmt(a.views)}</td>
      <td>${bar(a.hook3s,'#4A9EFF')}</td>
      <td>${bar(a.avg_watch_pct,'#F5A623')}</td>
      <td>${bar(a.completion,'#00C851')}</td>
      <td>${spark}</td>
      <td><span class="flag">▼ ${doff.drop} на ${doff.seg}</span></td>
      <td><div class="chips">${tools}</div></td>
      <td><span class="g g-${g}">${g}</span></td></tr>`;
  }).join('');
  return `<div class="section-t">Ролики по досмотру</div><div class="panel" style="overflow-x:auto">
    <table class="reels"><thead><tr><th>ролик</th><th>показы</th><th>hook 3с</th><th>ср. досмотр</th><th>до конца</th><th>кривая</th><th>точка слива</th><th>инструменты</th><th>оц.</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
function bar(v,c){return `<span class="bar"><i style="width:${v}%;background:${c}"></i></span> <span class="num">${v}%</span>`;}
function miniCurve(curve){const W=60,H=22;const xp=i=>i/(curve.length-1)*W,yp=v=>H-(v/100*H);
  const p=curve.map((v,i)=>`${i?'L':'M'}${xp(i).toFixed(1)},${yp(v).toFixed(1)}`).join(' ');
  return `<svg width="${W}" height="${H}"><path d="${p}" fill="none" stroke="#E8000A" stroke-width="1.5"/></svg>`;}

function render(){
  document.getElementById('app').innerHTML =
    kpis()+
    `<div class="grid2" style="margin-top:16px">${overlayChart()}${insights()}</div>`+
    reelsTable()+
    `<div class="section-t">Добавить факт из соцсетей</div>
     <div class="entry">После публикации возьми из <b>Instagram/TikTok Insights</b>: показы, удержание на 3с (hook rate), средний досмотр %, % до конца, сохранения, репосты — и кривую удержания, если платформа даёт.
     Скинь мне эти цифры (или CSV) — впишу в <code>reels.json</code>, и ролик появится в панели с полным разбором: прогноз ↔ факт, точка слива, влияние на досмотр.</div>`;
}

function openM(id){
  const r=DATA.reels.find(x=>x.id===id); if(!r)return;
  const a=r.actual||{}; const v=(r.variants||[]).find(x=>x.id===r.chosen)||(r.variants||[])[0];
  const pred=v&&v.score?v.score.predicted_curve:null;
  const doff=dropoff(a.curve||[100]);
  const W=100,H=56,pad=4,xp=i=>pad+(W-2*pad)*(i/4),yp=x=>pad+(H-2*pad)*(1-x/100);
  const path=arr=>arr.map((x,i)=>`${i?'L':'M'}${xp(i).toFixed(1)},${yp(x).toFixed(1)}`).join(' ');
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="height:170px">`;
  [0,25,50,75,100].forEach(x=>{const y=yp(x);svg+=`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#18181F" stroke-width=".5"/>`;});
  if(pred)svg+=`<path d="${path(pred)}" fill="none" stroke="#E8000A" stroke-width="1.3" stroke-dasharray="2 2" opacity=".7"/>`;
  if(a.curve)svg+=`<path d="${path(a.curve)}" fill="rgba(0,200,81,.08)" stroke="#00C851" stroke-width="1.7"/>`+a.curve.map((x,i)=>`<circle cx="${xp(i)}" cy="${yp(x)}" r="1.3" fill="#00C851"/>`).join('');
  svg+='</svg>';
  const script=v&&v.script&&v.script.length?`<div class="section-t">План монтажа</div><div class="tl"><table class="timeline"><thead><tr><th>t</th><th>реплика</th><th>субтитр</th><th>вставка</th></tr></thead><tbody>${v.script.map(s=>`<tr><td class="tl-t">${esc(s.t)}</td><td>${esc(s.vo)}</td><td style="color:var(--gold)">${esc(s.sub)}</td><td style="color:var(--blu)">${esc(s.insert)}</td></tr>`).join('')}</tbody></table></div>`:'';
  const tools=(r.tools_used||[]).map(t=>`<span class="chip">${esc(toolLabel(t))}</span>`).join('');
  document.getElementById('modal').innerHTML=`
    <span class="mclose" onclick="closeM()">✕</span>
    <h2>${esc(r.title)}</h2>
    <div class="plat" style="margin:4px 0 8px">${esc(a.platform||r.platform)} · ${r.duration}с · ${esc(a.published||'')} · <span style="color:var(--t2)">инструменты:</span> </div>
    <div class="chips" style="margin-bottom:10px">${tools||'<span class="chip">—</span>'}</div>
    <div class="mgrid">
      <div class="cell"><div class="cv" style="color:#4A9EFF">${a.hook3s??'—'}%</div><div class="cl">hook 3с</div></div>
      <div class="cell"><div class="cv" style="color:#F5A623">${a.avg_watch_pct??'—'}%</div><div class="cl">ср. досмотр</div></div>
      <div class="cell"><div class="cv" style="color:#00C851">${a.completion??'—'}%</div><div class="cl">до конца</div></div>
      <div class="cell"><div class="cv">${fmt(a.views||0)}</div><div class="cl">показы</div></div>
      <div class="cell"><div class="cv">${fmt(a.saves||0)}</div><div class="cl">сохранения</div></div>
      <div class="cell"><div class="cv">${fmt(a.shares||0)}</div><div class="cl">репосты</div></div>
      <div class="cell"><div class="cv">${fmt(a.likes||0)}</div><div class="cl">лайки</div></div>
      <div class="cell"><div class="cv">${fmt(a.comments||0)}</div><div class="cl">комменты</div></div>
    </div>
    <div class="section-t" style="margin-top:6px">Кривая удержания: прогноз ↔ факт</div>${svg}
    <div class="legend"><span><i style="background:#E8000A"></i> прогноз (Claude)</span><span><i style="background:#00C851"></i> факт</span></div>
    <div class="dropbox">⚠ Главная точка слива: <b>${doff.seg}</b> — теряется <b>${doff.drop} п.п.</b> зрителей. Это участок для усиления (панч, вставка, ускорение, вопрос-петля).</div>
    ${script}`;
  document.getElementById('ov').classList.add('on');
}
function closeM(){document.getElementById('ov').classList.remove('on');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM();});
load();
</script>
</body>
</html>
